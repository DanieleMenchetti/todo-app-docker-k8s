name: CD

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - CI
    branches:
      - develop/ci-cd
    types:
      - completed

permissions:
  contents: read

jobs:
  deploy:
    name: Prepare Kubernetes Deployment
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || 'develop/ci-cd' }}

      - name: Set image tag
        run: |
          echo "IMAGE_TAG=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Render Kubernetes manifests
        run: |
          mkdir -p rendered

          sed "s/IMAGE_TAG/${IMAGE_TAG:0:7}/g" \
            k8s/backend-deployment.yaml \
            > rendered/backend-deployment.yaml

          sed "s/IMAGE_TAG/${IMAGE_TAG:0:7}/g" \
            k8s/frontend-deployment.yaml \
            > rendered/frontend-deployment.yaml

      - name: Verify rendered images
        run: |
          echo "Rendered images:"

          grep "image:" rendered/backend-deployment.yaml
          grep "image:" rendered/frontend-deployment.yaml

          if grep -R "IMAGE_TAG" rendered/; then
            echo "ERROR: IMAGE_TAG was not replaced"
            exit 1
          fi

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Validate Kubernetes manifests
        run: |
          kubectl apply \
            --dry-run=client \
            -f rendered/backend-deployment.yaml

          kubectl apply \
            --dry-run=client \
            -f rendered/frontend-deployment.yaml

      - name: Upload rendered manifests
        uses: actions/upload-artifact@v4
        with:
          name: kubernetes-manifests
          path: rendered/