services:
  postgres:
    image: postgres:17

    environment:
      POSTGRES_DB: todo_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d todo_db"]
      interval: 5s
      timeout: 5s
      retries: 5

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend

    depends_on:
      postgres:
        condition: service_healthy
    
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health')"]
      interval: 5s
      timeout: 5s
      retries: 5

    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/todo_db

    ports:
      - "3000:3000"

  frontend:
    build:
      context: ./frontend

    depends_on:
      backend:
        condition: service_healthy

    ports:
      - "8080:80"

volumes:
  postgres_data: