resolver 127.0.0.11 valid=10s;

server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri /index.html;
    }

    location /api/ {
        set $backend http://backend:3000;

        rewrite ^/api/(.*)$ /$1 break;

        proxy_pass $backend;
    }
}